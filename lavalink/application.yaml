server:
  port: 2333
  address: 0.0.0.0
plugins:
  youtube:
    enabled: true
    allowSearch: true
    # Whether just video IDs can match. If false, only complete URLs will be loaded.
    allowDirectVideoIds: true
    # Whether just playlist IDs can match. If false, only complete URLs will be loaded.
    allowDirectPlaylistIds: true
    # The clients to use for track loading. See below for a list of valid clients.
    # Clients are queried in the order they are given (so the first client is queried first and so on...)
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
lavalink:
  plugins:
    - dependency: "com.github.topi314.sponsorblock:sponsorblock-plugin:3.0.1"
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.0"
  server:
    password: "youshallnotpass"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    # Setting to true reduces the number of allocations made by each player at the expense of frame rebuilding (e.g. non-instantaneous volume changes)
    nonAllocatingFrameBuffer: false
    # The duration of the NAS buffer. Higher values fare better against longer GC pauses. Duration <= 0 to disable JDA-NAS. Minimum of 40ms, lower values may introduce pauses.
    bufferDurationMs: 400
    # How many milliseconds of audio to keep buffered
    frameBufferDurationMs: 5000
    # Opus encoder quality. Valid values range from 0 to 10, where 10 is best quality but is the most expensive on the CPU.
    opusEncodingQuality: 10
    # Quality of resampling operations. Valid values are LOW, MEDIUM and HIGH, where HIGH uses the most CPU.
    resamplingQuality: MEDIUM
    # The threshold for how long a track can be stuck. A track is stuck if does not return any audio data.
    trackStuckThresholdMs: 10000
    # Seek ghosting is the effect where whilst a seek is in progress, the audio buffer is read from until empty, or until seek is ready.
    useSeekGhosting: true
    # Number of pages at 100 each
    youtubePlaylistLoadLimit: 6
    # How frequently to send player updates to clients, in seconds
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
    timeouts:
      connectTimeoutMs: 3000
      connectionRequestTimeoutMs: 3000
      socketTimeoutMs: 3000
